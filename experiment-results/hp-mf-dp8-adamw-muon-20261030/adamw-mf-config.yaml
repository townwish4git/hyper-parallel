seed: 42
output_dir: ${EXPERIMENT_ROOT}/mf/output
load_checkpoint: ${EXPERIMENT_ROOT}/anchor
load_ckpt_format: safetensors
auto_trans_ckpt: true
only_save_strategy: false
resume_training: false
ignore_data_skip: true
run_mode: train
use_parallel: true
use_legacy: false
print_separate_loss: true
train_precision_sync: true
trainer:
  type: CausalLanguageModelingTrainer
  model_name: deepseekv3
runner_config:
  epochs: 1
  batch_size: 1
  sink_mode: true
  sink_size: 1
  gradient_accumulation_steps: 2
optimizer:
  type: AdamW
  learning_rate: 0.00086
  betas:
  - 0.9
  - 0.95
  eps: 1.0e-08
  weight_decay: 0.1
lr_schedule:
  type: ConstantWarmUpLR
  learning_rate: 0.00086
  warmup_steps: 0
  total_steps: 20000
train_dataset:
  data_loader:
    type: HFDataLoader
    load_func: load_from_disk
    dataset_path: ${EXPERIMENT_ROOT}/data/replay
    create_attention_mask: true
    create_compressed_eod_mask: true
    compressed_eod_mask_length: 129
    use_broadcast_data: false
    shuffle: false
    handler:
    - type: rename_column
      original_column_name: cu_seqlens
      new_column_name: actual_seq_len
    - type: remove_columns
      column_names:
      - cu_seqlens_padded
      - real_len
  input_columns:
  - input_ids
  - labels
  - loss_mask
  - position_ids
  - actual_seq_len
  construct_args_key:
  - input_ids
  - labels
  - loss_mask
  - position_ids
  - actual_seq_len
  num_parallel_workers: 1
  python_multiprocessing: false
  drop_remainder: true
  numa_enable: false
  prefetch_size: 1
train_dataset_task:
  type: CausalLanguageModelDataset
  dataset_config:
    data_loader:
      type: HFDataLoader
      load_func: load_from_disk
      dataset_path: ${EXPERIMENT_ROOT}/data/replay
      create_attention_mask: true
      create_compressed_eod_mask: true
      compressed_eod_mask_length: 129
      use_broadcast_data: false
      shuffle: false
      handler:
      - type: rename_column
        original_column_name: cu_seqlens
        new_column_name: actual_seq_len
      - type: remove_columns
        column_names:
        - cu_seqlens_padded
        - real_len
    input_columns:
    - input_ids
    - labels
    - loss_mask
    - position_ids
    - actual_seq_len
    construct_args_key:
    - input_ids
    - labels
    - loss_mask
    - position_ids
    - actual_seq_len
    num_parallel_workers: 1
    python_multiprocessing: false
    drop_remainder: true
    numa_enable: false
    prefetch_size: 1
context:
  mode: 0
  device_target: Ascend
  max_call_depth: 10000
  max_device_memory: 59GB
  save_graphs: false
  save_graphs_path: ${EXPERIMENT_ROOT}/mf/graphs
  device_id: 0
  memory_optimize_level: O0
  jit_config:
    jit_level: O1
  ascend_config:
    parallel_speed_up_json_path: ${MF_ROOT}/configs/qwen3/parallel_speed_up.json
parallel_config:
  data_parallel: 8
  model_parallel: 1
  pipeline_stage: 1
  context_parallel: 1
  context_parallel_algo: ulysses_cp
  ulysses_degree_in_cp: 1
  expert_parallel: 1
  micro_batch_num: 1
  use_seq_parallel: false
  gradient_aggregation_group: 4
micro_batch_interleave_num: 1
parallel:
  parallel_mode: 1
  gradients_mean: false
  enable_alltoall: true
  full_batch: false
  dataset_strategy:
  - &id001
    - 8
    - 1
  - *id001
  - *id001
  - *id001
  - *id001
  search_mode: sharding_propagation
  enable_parallel_optimizer: true
  strategy_ckpt_config:
    save_file: ${EXPERIMENT_ROOT}/mf/strategy.ckpt
    only_trainable_params: false
  parallel_optimizer_config:
    gradient_accumulation_shard: false
    parallel_optimizer_threshold: 64
    optimizer_weight_shard_size: 2
  pipeline_config:
    pipeline_interleave: false
    pipeline_scheduler: 1f1b
recompute_config:
  recompute: false
  select_recompute: false
  parallel_optimizer_comm_recompute: false
  mp_comm_recompute: false
  recompute_slice_activation: false
model:
  model_config:
    model_type: deepseek_v3
    architectures:
    - DeepseekV3ForCausalLM
    batch_size: 1
    offset: 0
    pp_interleave_num: 1
    vocab_size: 152064
    seq_length: 4096
    hidden_size: 1280
    intermediate_size: 7168
    num_hidden_layers: 11
    max_position_embeddings: 4096
    hidden_act: silu
    num_attention_heads: 16
    rms_norm_eps: 1.0e-20
    add_bias_linear: false
    use_flash_attention: true
    multi_latent_attention: true
    mla_qkv_concat: false
    kv_lora_rank: 512
    q_lora_rank: 512
    qk_rope_head_dim: 64
    v_head_dim: 128
    qk_nope_head_dim: 128
    qk_layernorm: true
    position_embedding_type: rope
    rope_theta: 10000
    rotary_scaling_factor: 1
    beta_fast: 32
    beta_slow: 1
    mscale: 1
    mscale_all_dim: 1
    attention_dropout: 0.0
    hidden_dropout: 0.0
    params_dtype: float32
    compute_dtype: bfloat16
    layernorm_compute_dtype: float32
    softmax_compute_dtype: float32
    rotary_dtype: float32
    initializer_range: 0.02
    num_nextn_predict_layers: 1
    mtp_loss_factor: 0.3
    router_dense_type: float32
    gated_linear_unit: true
    moe_grouped_gemm: true
    use_fused_ops_topkrouter: true
    first_k_dense_replace: 1
    moe_intermediate_size: 896
    n_shared_experts: 2
    routed_scaling_factor: 2.446
    n_routed_experts: 64
    num_experts_per_tok: 6
    scoring_func: sigmoid
    norm_topk_prob: true
    topk_group: 1
    n_group: 1
    use_pad_tokens: true
    moe_token_dispatcher_type: alltoall
    npu_nums_per_device: 16
    moe_router_load_balancing_type: seq_aux_loss
    moe_aux_loss_coeff: 0.0
    moe_token_drop_policy: false
    moe_router_enable_expert_bias: true
    moe_router_bias_update_rate: 0.001
    num_key_value_heads: 16
callbacks:
- type: MFLossMonitor
- type: TopkBiasBalanceCallback
  gradient_accumulation_steps: 2
- type: TrainCallBack
  stop_step: 100
runner_wrapper:
  type: MFTrainOneStepCell
  scale_sense: 1.0
  use_clip_grad: true
profile: false
profile_start_step: 5
profile_stop_step: 6
init_start_profile: true
profile_communication: false
profile_memory: false
profile_pipeline: false
with_stack: false
profiler_level: 0
data_simplification: true
mstx: true
