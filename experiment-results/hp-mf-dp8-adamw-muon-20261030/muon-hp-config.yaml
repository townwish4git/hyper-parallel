model:
  _target_: hyper_parallel.models.jt_deepseek_v3.adapter.jt_builder.build_jt_model
  config:
    architectures:
    - JTDeepseekV3ForCausalLM
    vocab_size: 152064
    hidden_size: 1280
    intermediate_size: 7168
    moe_intermediate_size: 896
    num_hidden_layers: 11
    num_attention_heads: 16
    num_key_value_heads: 16
    n_shared_experts: 2
    n_routed_experts: 64
    routed_scaling_factor: 2.446
    kv_lora_rank: 512
    q_lora_rank: 512
    qk_rope_head_dim: 64
    v_head_dim: 128
    qk_nope_head_dim: 128
    n_group: 1
    topk_group: 1
    num_experts_per_tok: 6
    norm_topk_prob: true
    hidden_act: silu
    max_position_embeddings: 4096
    initializer_range: 0.02
    rms_norm_eps: 1.0e-20
    first_k_dense_replace: 1
    mlp_layer_types:
    - dense
    - sparse
    - sparse
    - sparse
    - sparse
    - sparse
    - sparse
    - sparse
    - sparse
    - sparse
    - sparse
    layer_types:
    - full_attention
    - full_attention
    - full_attention
    - full_attention
    - full_attention
    - full_attention
    - full_attention
    - full_attention
    - full_attention
    - full_attention
    - full_attention
    attention_dropout: 0.0
    rope_parameters:
      rope_type: default
      rope_theta: 10000
    rope_interleave: true
    tie_word_embeddings: false
    use_cache: false
    attention_bias: false
    mlp_bias: false
    num_nextn_predict_layers: 1
    mtp_loss_factor: 0.3
    use_pad_tokens: true
    moe_aux_loss_coeff: 0.0
    moe_router_enable_expert_bias: true
    moe_router_bias_update_rate: 0.001
    enable_chunk_loss: true
    chunk_loss_size: 4096
  reference_weights: ${EXPERIMENT_ROOT}/anchor
loss_fn:
  _target_: hyper_parallel.components.losses.ModelOutputLoss
model_init_dtype: float32
plan_overrides:
- match:
  - model.layers.*.self_attn
  - mtp.layers.*.transformer_layer.self_attn
  module_type: hyper_parallel.models.jt_deepseek_v3.modeling_jt_deepseek_v3.JTDeepseekV3Attention
  exact_type: true
  replace_module:
    _target_: hyper_parallel.models.jt_deepseek_v3.modeling_jt_deepseek_v3.JTDeepseekV3MLAAttention
- match: '*.self_attn'
  params:
    linear_qkv.weight:
      tp: replicate
    q_b_proj.weight:
      tp: shard(0)
    kv_b_proj.weight:
      tp: shard(0)
    o_proj.weight:
      tp: shard(1)
  region_dispatch: false
  in_src:
    hidden_states:
      tp: shard(1)
  in_dst:
    hidden_states:
      tp: shard(1)
- match: '*.self_attn.*_layernorm'
  in_src:
    hidden_states:
      tp: shard(1)
  in_dst:
    hidden_states:
      tp: shard(1)
  out_src:
    tp: shard(1)
  out_dst:
    tp: replicate
- match: '*.self_attn.key_rope_gather'
  in_src:
    input:
      tp: shard(1)
  in_dst:
    input:
      tp: shard(1)
  out_src:
    tp: shard(1)
  out_dst:
    tp: replicate
- match: '*.mlp.shared_experts'
  params:
    linear_fc1.weight:
      tp: replicate
    linear_fc2.weight:
      tp: replicate
  in_src:
    x:
      tp: shard(1)
  in_dst:
    x:
      tp: shard(1)
  out_src:
    tp: shard(1)
  out_dst:
    tp: shard(1)
- match: mtp.layers.*.eh_proj
  params:
    weight:
      tp: replicate
  in_src:
    input:
      tp: shard(1)
  in_dst:
    input:
      tp: shard(1)
  out_src:
    tp: shard(1)
  out_dst:
    tp: shard(1)
- match: model.layers.[123456789]*.mlp
  when: ep
  region_dispatch: false
  local_compute_fn:
    _target_: hyper_parallel.models.jt_deepseek_v3.adapter.distributed.ep_compute.jt_deepseek_v3_ep_compute_fn
- match: mtp.layers.*.transformer_layer.mlp
  when: ep
  region_dispatch: false
  local_compute_fn:
    _target_: hyper_parallel.models.jt_deepseek_v3.adapter.distributed.ep_compute.jt_deepseek_v3_ep_compute_fn
- match:
  - '*.input_layernorm'
  - '*.post_attention_layernorm'
  - model.norm
  - mtp.layers.*.enorm
  - mtp.layers.*.hnorm
  - mtp.layers.*.final_layernorm
  module_type: transformers.models.deepseek_v32.modeling_deepseek_v32.DeepseekV32RMSNorm
  exact_type: true
  replace_module:
    _target_: hyper_parallel.components.modules.rms_norm.RMSNorm
- match:
  - model.layers.0.mlp
  - '*.mlp.shared_experts'
  module_type: transformers.models.deepseek_v32.modeling_deepseek_v32.DeepseekV32MLP
  exact_type: true
  replace_module:
    _target_: hyper_parallel.components.modules.swiglu_mlp.SwiGLUMLP
training:
  train_iters: 100
  lr_scheduler_iters: 20000
  max_grad_norm: 1.0
  global_batch_size: 16
  micro_batch_size: 1
  backend: hccl
  seed: 42
  enable_full_determinism: true
accelerator:
  tp_size: 1
  ep_size: 1
  cp_size: 1
  pp_size: 1
  sequence_parallel: false
  loss_parallel: false
fsdp_config:
