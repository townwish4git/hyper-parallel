<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh-CN" width="960" height="512" viewBox="0 0 960 512" role="img" aria-labelledby="title description">
  <title id="title">一对对称块如何写回</title>
  <desc id="description">A2/A3 由 Cube 写出下三角块，Vector 回读、转置后写出上三角块。A5 由 Fixpipe 从一个 L0C 累加器按行和按列分别写回两个输出位置。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#929eaf" stroke-width="1.7"/>
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #f1f4f7; }
    .title { font-size: 28px; font-weight: 700; }
    .subtitle { font-size: 16px; fill: #b4bfce; }
    .heading { font-size: 19px; font-weight: 650; }
    .body { font-size: 16px; font-weight: 550; }
    .small { font-size: 14px; fill: #bac3ce; }
    .count { font-size: 26px; font-weight: 700; }
    .teal-text { fill: #66e0bc; }
    .amber-text { fill: #ffcb82; }
    .panel { fill: #1b1e24; stroke: #3a404a; stroke-width: 1.3; }
    .cube { fill: #24486f; stroke: #3f719f; stroke-width: 1.3; }
    .vector { fill: #174b40; stroke: #2d8e76; stroke-width: 1.3; }
    .memory { fill: #2d323c; stroke: #4c5766; stroke-width: 1.3; }
    .removed { fill: #302921; stroke: #8a6643; stroke-width: 1.3; }
    .calc-tile { fill: #367abe; stroke: #5695d3; stroke-width: 1; }
    .copy-tile { fill: #292f37; stroke: #9ba8b7; stroke-width: 1.3; stroke-dasharray: 5 3; }
    .example { stroke: #ffcb82; stroke-width: 2.5; }
    .connector { fill: none; stroke: #929eaf; stroke-width: 1.7; marker-end: url(#arrow); }
    .guide { fill: none; stroke: #657287; stroke-width: 1.4; stroke-dasharray: 5 5; }
  </style>
  <rect width="960" height="512" rx="20" fill="#14171c"/>
  <text class="title" x="28" y="46">一对对称块如何写回</text>
  <text class="subtitle" x="28" y="73">跟踪一个非对角块，比较从 Cube 到两个输出位置的数据路径。</text>
  <rect class="panel" x="28" y="96" width="438" height="393" rx="15"/>
  <rect class="panel" x="494" y="96" width="438" height="393" rx="15"/>
  <text class="heading" x="247" y="129" text-anchor="middle">A2 / A3 · Vector 镜像转置</text>
  <text class="heading" x="713" y="129" text-anchor="middle">A5 · Fixpipe 双写</text>
  <path class="connector" d="M 247 193 V 214"/>
  <path class="connector" d="M 247 273 V 294"/>
  <path class="connector" d="M 247 353 V 374"/>
  <path class="connector" d="M 713 193 V 214"/>
  <path class="connector" d="M 713 273 V 308 H 611 V 374"/>
  <path class="connector" d="M 713 273 V 308 H 815 V 374"/>
  <rect class="cube" x="55" y="145" width="384" height="48" rx="8"/>
  <text class="body" x="247.0" y="175.0" text-anchor="middle">Cube 计算块 (i, j)</text>
  <rect class="memory" x="55" y="215" width="384" height="58" rx="8"/>
  <text class="body" x="247.0" y="241.0" text-anchor="middle">GM · 写入下三角块 (i, j)</text>
  <text class="small" x="247.0" y="261.0" text-anchor="middle">FP16 或 BF16</text>
  <rect class="vector" x="55" y="295" width="384" height="58" rx="8"/>
  <text class="body" x="247.0" y="321.0" text-anchor="middle">Vector 回读下三角块</text>
  <text class="small" x="247.0" y="341.0" text-anchor="middle">在 UB 中转置 64×64 小块</text>
  <rect class="memory" x="55" y="375" width="384" height="58" rx="8"/>
  <text class="body" x="247.0" y="401.0" text-anchor="middle">GM · 写入上三角块 (j, i)</text>
  <text class="small" x="247.0" y="421.0" text-anchor="middle">取自下三角块的转置结果</text>
  <rect class="cube" x="521" y="145" width="384" height="48" rx="8"/>
  <text class="body" x="713.0" y="175.0" text-anchor="middle">Cube 计算块 (i, j)</text>
  <rect class="cube" x="521" y="215" width="384" height="58" rx="8"/>
  <text class="body" x="713.0" y="241.0" text-anchor="middle">Fixpipe 复用同一个 L0C 累加器</text>
  <text class="small" x="713.0" y="261.0" text-anchor="middle">两次写回使用相同的精度转换</text>
  <rect class="memory" x="521" y="375" width="180" height="58" rx="8"/>
  <text class="body" x="611.0" y="401.0" text-anchor="middle">GM · 下三角块</text>
  <text class="small" x="611.0" y="421.0" text-anchor="middle">按行写回 · (i, j)</text>
  <rect class="memory" x="725" y="375" width="180" height="58" rx="8"/>
  <text class="body" x="815.0" y="401.0" text-anchor="middle">GM · 上三角块</text>
  <text class="small" x="815.0" y="421.0" text-anchor="middle">按列写回 · (j, i)</text>
  <text class="small" x="247" y="466" text-anchor="middle">两次 GM 写回，加一次回读</text>
  <text class="small teal-text" x="713" y="466" text-anchor="middle">两次 GM 写回</text>
</svg>
