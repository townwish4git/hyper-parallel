<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh-CN" width="960" height="447" viewBox="0 0 960 447" role="img" aria-labelledby="title description">
  <title id="title">Muon 融合迭代中的 Cube／Vector 并行</title>
  <desc id="description">首先得到完整的 Gram 矩阵 A。平方阶段中，Vector 求上一块 B 时，Cube 可以同时计算下一块 S。更新阶段中，Vector 给上一块 Y 加 aX 时，Cube 可以同时计算下一块 Y。两道屏障分别等待完整的 A 和 B。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#929eaf" stroke-width="1.7"/>
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #f1f4f7; }
    .title { font-size: 28px; font-weight: 700; }
    .subtitle { font-size: 16px; fill: #b4bfce; }
    .heading { font-size: 19px; font-weight: 650; }
    .body { font-size: 16px; font-weight: 550; }
    .small { font-size: 14px; fill: #bac3ce; }
    .count { font-size: 26px; font-weight: 700; }
    .teal-text { fill: #66e0bc; }
    .amber-text { fill: #ffcb82; }
    .panel { fill: #1b1e24; stroke: #3a404a; stroke-width: 1.3; }
    .cube { fill: #24486f; stroke: #3f719f; stroke-width: 1.3; }
    .vector { fill: #174b40; stroke: #2d8e76; stroke-width: 1.3; }
    .memory { fill: #2d323c; stroke: #4c5766; stroke-width: 1.3; }
    .removed { fill: #302921; stroke: #8a6643; stroke-width: 1.3; }
    .calc-tile { fill: #367abe; stroke: #5695d3; stroke-width: 1; }
    .copy-tile { fill: #292f37; stroke: #9ba8b7; stroke-width: 1.3; stroke-dasharray: 5 3; }
    .example { stroke: #ffcb82; stroke-width: 2.5; }
    .connector { fill: none; stroke: #929eaf; stroke-width: 1.7; marker-end: url(#arrow); }
    .guide { fill: none; stroke: #657287; stroke-width: 1.4; stroke-dasharray: 5 5; }
  </style>
  <rect width="960" height="447" rx="20" fill="#14171c"/>
  <text class="title" x="28" y="46">Muon 融合迭代中的 Cube／Vector 并行</text>
  <text class="subtitle" x="28" y="73">三个阶段在同一次内核提交中执行。就绪信号驱动分块接力，阶段屏障保护跨核依赖。</text>
  <rect class="panel" x="28" y="96" width="904" height="290" rx="15"/>
  <rect class="memory" x="438" y="160" width="61" height="135" rx="5"/>
  <rect class="memory" x="724" y="160" width="61" height="135" rx="5"/>
  <path class="guide" d="M 350 111 V 305"/>
  <path class="guide" d="M 646 111 V 305"/>
  <text class="heading" x="228" y="124" text-anchor="middle">① Gram 矩阵</text>
  <text class="heading" x="499" y="124" text-anchor="middle">② 平方与多项式</text>
  <text class="heading" x="795" y="124" text-anchor="middle">③ 矩阵更新</text>
  <text class="small" x="499" y="148" text-anchor="middle">S = A²，B = bA + cS</text>
  <text class="small" x="795" y="148" text-anchor="middle">Y = B × X，X_next = aX + Y</text>
  <text class="body" x="51" y="193">Cube</text>
  <text class="body" x="51" y="253">Vector</text>
  <text class="small teal-text" x="468" y="290" text-anchor="middle">重叠区间</text>
  <text class="small teal-text" x="754" y="290" text-anchor="middle">重叠区间</text>
  <text class="small amber-text" x="350" y="323" text-anchor="middle">屏障 1 · 完整 A 就绪</text>
  <text class="small amber-text" x="646" y="323" text-anchor="middle">屏障 2 · 完整 B 就绪</text>
  <path class="connector" d="M 132 352 H 911"/>
  <text class="small" x="884" y="375">时间</text>
  <text class="small" x="228" y="283" text-anchor="middle">A5 · Fixpipe 双写，Vector 等待</text>
  <rect class="cube" x="132" y="166" width="192" height="42" rx="8"/>
  <text class="body" x="228.0" y="193.0" text-anchor="middle">A = X × Xᵀ</text>
  <rect class="vector" x="170" y="226" width="154" height="42" rx="8"/>
  <text class="body" x="247.0" y="253.0" text-anchor="middle">A2/A3 · 镜像转置</text>
  <rect class="cube" x="370" y="166" width="64" height="42" rx="8"/>
  <text class="body" x="402.0" y="193.0" text-anchor="middle">S₀</text>
  <rect class="vector" x="438" y="226" width="59" height="42" rx="8"/>
  <text class="body" x="467.5" y="253.0" text-anchor="middle">求 B₀</text>
  <path class="connector" d="M 434 208 l 11 17"/>
  <rect class="cube" x="438" y="166" width="64" height="42" rx="8"/>
  <text class="body" x="470.0" y="193.0" text-anchor="middle">S₁</text>
  <rect class="vector" x="506" y="226" width="59" height="42" rx="8"/>
  <text class="body" x="535.5" y="253.0" text-anchor="middle">求 B₁</text>
  <path class="connector" d="M 502 208 l 11 17"/>
  <rect class="cube" x="506" y="166" width="64" height="42" rx="8"/>
  <text class="body" x="538.0" y="193.0" text-anchor="middle">S₂</text>
  <rect class="vector" x="574" y="226" width="59" height="42" rx="8"/>
  <text class="body" x="603.5" y="253.0" text-anchor="middle">求 B₂</text>
  <path class="connector" d="M 570 208 l 11 17"/>
  <rect class="cube" x="656" y="166" width="64" height="42" rx="8"/>
  <text class="body" x="688.0" y="193.0" text-anchor="middle">Y₀</text>
  <rect class="vector" x="724" y="226" width="59" height="42" rx="8"/>
  <text class="body" x="753.5" y="253.0" text-anchor="middle">加 aX₀</text>
  <path class="connector" d="M 720 208 l 11 17"/>
  <rect class="cube" x="724" y="166" width="64" height="42" rx="8"/>
  <text class="body" x="756.0" y="193.0" text-anchor="middle">Y₁</text>
  <rect class="vector" x="792" y="226" width="59" height="42" rx="8"/>
  <text class="body" x="821.5" y="253.0" text-anchor="middle">加 aX₁</text>
  <path class="connector" d="M 788 208 l 11 17"/>
  <rect class="cube" x="792" y="166" width="64" height="42" rx="8"/>
  <text class="body" x="824.0" y="193.0" text-anchor="middle">Y₂</text>
  <rect class="vector" x="860" y="226" width="59" height="42" rx="8"/>
  <text class="body" x="889.5" y="253.0" text-anchor="middle">加 aX₂</text>
  <path class="connector" d="M 856 208 l 11 17"/>
  <rect class="cube" x="86" y="408" width="16" height="16" rx="3"/>
  <text class="small" x="110" y="421">矩阵乘分块</text>
  <rect class="vector" x="260" y="408" width="16" height="16" rx="3"/>
  <text class="small" x="284" y="421">Vector 后处理</text>
  <rect class="memory" x="464" y="408" width="16" height="16" rx="3"/>
  <text class="small" x="488" y="421">同一时段的 Cube 和 Vector 工作</text>
  <text class="small" x="817" y="421" text-anchor="middle">时序示意</text>
</svg>
