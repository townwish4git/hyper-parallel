<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh-CN" width="960" height="637" viewBox="0 0 960 637" role="img" aria-labelledby="title description">
  <title id="title">逐块融合多项式求值</title>
  <desc id="description">分开执行时，将两个缩放结果写入 GM，相加前再读回。融合后，Vector 在 UB 内完成舍入和相加，将多项式结果覆盖到原平方块。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#929eaf" stroke-width="1.7"/>
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #f1f4f7; }
    .title { font-size: 28px; font-weight: 700; }
    .subtitle { font-size: 16px; fill: #b4bfce; }
    .heading { font-size: 19px; font-weight: 650; }
    .body { font-size: 16px; font-weight: 550; }
    .small { font-size: 14px; fill: #bac3ce; }
    .count { font-size: 26px; font-weight: 700; }
    .teal-text { fill: #66e0bc; }
    .amber-text { fill: #ffcb82; }
    .panel { fill: #1b1e24; stroke: #3a404a; stroke-width: 1.3; }
    .cube { fill: #24486f; stroke: #3f719f; stroke-width: 1.3; }
    .vector { fill: #174b40; stroke: #2d8e76; stroke-width: 1.3; }
    .memory { fill: #2d323c; stroke: #4c5766; stroke-width: 1.3; }
    .removed { fill: #302921; stroke: #8a6643; stroke-width: 1.3; }
    .calc-tile { fill: #367abe; stroke: #5695d3; stroke-width: 1; }
    .copy-tile { fill: #292f37; stroke: #9ba8b7; stroke-width: 1.3; stroke-dasharray: 5 3; }
    .example { stroke: #ffcb82; stroke-width: 2.5; }
    .connector { fill: none; stroke: #929eaf; stroke-width: 1.7; marker-end: url(#arrow); }
    .guide { fill: none; stroke: #657287; stroke-width: 1.4; stroke-dasharray: 5 5; }
  </style>
  <rect width="960" height="637" rx="20" fill="#14171c"/>
  <text class="title" x="28" y="46">逐块融合多项式求值</text>
  <text class="subtitle" x="28" y="73">从 A 和 A² 出发，对比计算 B = bA + cA² 的访存路径。</text>
  <rect class="cube" x="176" y="94" width="268" height="48" rx="8"/>
  <text class="body" x="310.0" y="124.0" text-anchor="middle">Cube 计算 A²</text>
  <path class="connector" d="M 444 118 H 496"/>
  <rect class="memory" x="496" y="94" width="288" height="48" rx="8"/>
  <text class="body" x="640.0" y="124.0" text-anchor="middle">GM · 写入 A²</text>
  <g transform="translate(0 69)">
  <rect class="panel" x="28" y="96" width="438" height="449" rx="15"/>
  <rect class="panel" x="494" y="96" width="438" height="449" rx="15"/>
  <text class="heading" x="247" y="130" text-anchor="middle">分开执行</text>
  <text class="heading" x="713" y="130" text-anchor="middle">分块融合</text>
  <path class="connector" d="M 148 201 V 228"/>
  <path class="connector" d="M 346 201 V 228"/>
  <path class="connector" d="M 148 273 V 299"/>
  <path class="connector" d="M 346 273 V 299"/>
  <path class="connector" d="M 148 349 V 368 H 247 V 387"/>
  <path class="connector" d="M 346 349 V 368 H 247"/>
  <path class="connector" d="M 247 432 V 459"/>
  <path class="connector" d="M 614 201 V 223 H 713 V 246"/>
  <path class="connector" d="M 812 201 V 223 H 713"/>
  <path class="connector" d="M 713 379 V 459"/>
  <rect class="memory" x="55" y="153" width="186" height="48" rx="8"/>
  <text class="body" x="148.0" y="183.0" text-anchor="middle">GM · 读取 A</text>
  <rect class="memory" x="253" y="153" width="186" height="48" rx="8"/>
  <text class="body" x="346.0" y="183.0" text-anchor="middle">GM · 读取 A²</text>
  <rect class="memory" x="521" y="153" width="186" height="48" rx="8"/>
  <text class="body" x="614.0" y="183.0" text-anchor="middle">GM · 读取 A</text>
  <rect class="memory" x="719" y="153" width="186" height="48" rx="8"/>
  <text class="body" x="812.0" y="183.0" text-anchor="middle">GM · 读取 A²</text>
  <rect class="vector" x="55" y="228" width="186" height="45" rx="8"/>
  <text class="body" x="148.0" y="256.5" text-anchor="middle">乘以系数 b</text>
  <rect class="vector" x="253" y="228" width="186" height="45" rx="8"/>
  <text class="body" x="346.0" y="256.5" text-anchor="middle">乘以系数 c</text>
  <rect class="removed" x="55" y="299" width="186" height="50" rx="8"/>
  <text class="body" x="148.0" y="330.0" text-anchor="middle">GM · 写入 bA</text>
  <rect class="removed" x="253" y="299" width="186" height="50" rx="8"/>
  <text class="body" x="346.0" y="330.0" text-anchor="middle">GM · 写入 cA²</text>
  <rect class="vector" x="55" y="387" width="384" height="45" rx="8"/>
  <text class="body" x="247.0" y="415.5" text-anchor="middle">回读两个缩放结果并相加</text>
  <rect class="vector" x="521" y="246" width="384" height="133" rx="8"/>
  <text class="body" x="713" y="277" text-anchor="middle">Vector · 两项均保留在 UB</text>
  <text class="small" x="713" y="311" text-anchor="middle">分别缩放，并将每项舍入到 BF16</text>
  <text class="small" x="713" y="337" text-anchor="middle">两项相加，将 B 舍入到 BF16</text>
  <text class="small teal-text" x="713" y="362" text-anchor="middle">复用同一分块缓冲区</text>
  <rect class="memory" x="55" y="459" width="384" height="51" rx="8"/>
  <text class="body" x="247.0" y="490.5" text-anchor="middle">GM · 写入 B</text>
  <rect class="memory" x="521" y="459" width="384" height="51" rx="8"/>
  <text class="body" x="713.0" y="490.5" text-anchor="middle">GM · 将 B 写回原 A² 的位置</text>
  <text class="small amber-text" x="247" y="531" text-anchor="middle">两个缩放结果各有一次 GM 写入和回读</text>
  <text class="small teal-text" x="713" y="531" text-anchor="middle">只写回多项式结果 B</text>
  </g>
</svg>
