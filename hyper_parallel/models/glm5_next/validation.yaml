schema_version: 2
model:
  adapter: glm5_next
  builder:
    _target_: hyper_parallel.models.glm5_next.adapter.build.build_glm5_next
    config_path: examples/training_demo/glm5_next/config_a5.json
    indexer_mode: sparse
launcher:
  module: scripts.train_vl
  config: recipes/train_a5.yaml
  timeout_seconds: 3600
matrix:
  devices: 4
  steps: 12
  resume_split_step: 2
  performance_warmup_steps: 2
  shared_initial_checkpoint: true
  baseline: {tp: 1, cp: 1, ep: 1, fsdp: 1, recompute_layer: []}
  combined:
    - {cp: 2, ep: 1, fsdp: 2}
    - {cp: 1, ep: 2, fsdp: 2}
    - {cp: 2, ep: 2, fsdp: 4}
  same_topology_resume: true
acceptance:
  parameters:
    module_parity: {atol: 0.0001, rtol: 0.001, relative_l2: 0.001}
  same_topology: {loss_max_abs: 0.00001, norm_max_abs: 0.0001}
  cross_topology: {loss_max_abs: 0.005, norm_max_abs: 0.05}
